name = "srbsuae-survey"
main = "index.js"
compatibility_date = "2026-01-01"
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://srbsuae.com,https://www.srbsuae.com"
MAX_PER_VOTER = "3"
COOLDOWN_SECONDS = "300"
HOURLY_CAP = "200"
MIN_PUBLIC = "30"
ML_GROUP_SR = "200658702917699267"
ML_GROUP_EN = "200658718794188724"

[[d1_databases]]
binding = "DB"
database_name = "srbsuae-survey"
database_id = "c2d64386-b409-4ba9-87f3-91b070c668af"

[[unsafe.bindings]]
name = "RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (never commit): wrangler secret put TURNSTILE_SECRET / VOTER_SALT / MAILERLITE_API_KEY
